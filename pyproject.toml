[build-system]
requires = ["setuptools>=64"]  # >=64 for PEP 660 editable installs
build-backend = "setuptools.build_meta"

[project]
name = "sql-query-ai-agent"
version = "1.1.0"
description = "Natural-language questions to safe, read-only SQL over an e-commerce SQLite database."
readme = "README.md"
requires-python = ">=3.12,<3.14"  # 3.12 on Render, 3.13 on Colab (A-24)
authors = [{ name = "Aviraj Khanchi" }]

# Exact pins for every direct dependency. Runtime pins carried over from the old
# requirements.txt (verified 15 Aug 2026); pydantic-settings and dev pins taken
# from a clean Colab venv `pip freeze` on 24 Sep 2026 (Python 3.13.15); bandit,
# pip-audit and pytest 9.0.3 added in Phase 2 after a local scan.
# Transitive packages are observed, not pinned: langchain-core 1.6.4,
# groq 0.37.1, pydantic 2.13.5 (recorded as a D-entry in Phase 1).
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "langgraph==1.2.9",
    "langchain-groq==1.1.3",
    "python-dotenv==1.2.3",       # read by pydantic-settings for .env support
    "pydantic-settings==2.15.0",  # typed, validated config (Phase 1 step 4)
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",               # 8.4.2 had PYSEC-2026-1845 (pip-audit, S5)
    "httpx==0.28.1",              # FastAPI TestClient transport
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "bandit[toml]==1.9.4",        # security lint of app/ (CI)
    "pip-audit==2.10.1",          # known-vulnerability audit of installed deps (CI)
]

[tool.setuptools]
# Explicit: auto-discovery fails on a flat layout with several top-level dirs
# (app, database, frontend, evals, tests), and only `app` is a package.
packages = ["app"]

# --- pytest --------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]                # bare `pytest` works; no more `python -m` requirement
addopts = "-ra --strict-markers --strict-config"
markers = [
    "live: calls the real Groq API; never selected by default",
]

# --- coverage ------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# fail_under is set in Phase 8 once thresholds are agreed.

# --- bandit --------------------------------------------------------------
[tool.bandit]
# Only application code is scanned; tests use assert by design and evals/
# drives git via subprocess on purpose.
exclude_dirs = ["tests", "evals", "notebooks", "database"]

# --- ruff ----------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
# Markdown is excluded: ruff 0.16 formats Python blocks inside .md files, which
# stripped deliberately aligned comments in docs/workflow.md. Docs stay author-formatted.
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"

# --- mypy ----------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
# The pydantic plugin makes mypy understand BaseSettings/BaseModel __init__
# (all BaseSettings fields may come from the environment, not only kwargs).
plugins = ["pydantic.mypy"]
# Legacy modules are checked leniently. Each new or rewritten module is made
# strict with a [[tool.mypy.overrides]] entry in the step that creates it.

# Per-module strictness is spelled out flag by flag. `strict = true` inside an
# override leaked to every module under mypy 2.3.1 (34 errors in legacy code),
# so the individual per-module flags that make up --strict are listed instead.
[[tool.mypy.overrides]]
module = ["app.config"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
