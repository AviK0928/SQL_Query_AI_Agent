# Live evals: the "Run evals" button (D32).
#
# Manual dispatch only. Nothing here runs on push or PR, so CI never spends Groq
# quota (Section 8.9). GitHub shows the "Run workflow" button only once this file
# is on the default branch (main).
#
# Needs: secret GROQ_API_KEY; repository variables GROQ_MODEL and LLM_LIMITS
# (the Render values; LLM_LIMITS must also list every model under test).
# Reports are uploaded as an artifact and never committed from CI.

name: Run evals

on:
  workflow_dispatch:
    inputs:
      role:
        description: Role under test
        type: choice
        options: [sql_generator, sql_repair, synthesizer]
        default: sql_generator
      model:
        description: Groq model id for that role (needs an LLM_LIMITS entry)
        type: string
        required: true
      tag:
        description: Report tag, e.g. smoke-20b (letters, digits, . _ -)
        type: string
        required: true
      suites:
        description: Space-separated suites; blank = the role's suites
        type: string
        default: ""
      ids:
        description: Space-separated item ids; blank = the whole suite
        type: string
        default: ""
      repeats:
        description: Repeats per item
        type: choice
        options: ["1", "2", "3"]
        default: "1"
      live_tests:
        description: Also run pytest -m live first (a few calls)
        type: boolean
        default: false

permissions:
  contents: read

# One live job at a time across the repo: parallel runs would share one daily
# quota and pace each other into 429s. Queued, never cancelled mid-run.
concurrency:
  group: groq-live
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  eval:
    name: Eval ${{ inputs.role }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check inputs and configuration
        # Inputs reach the shell only as env vars, never as ${{ }} inside run:,
        # so a crafted value cannot inject commands (same rule as pr-title.yml).
        env:
          MODEL: ${{ inputs.model }}
          TAG: ${{ inputs.tag }}
          SUITES: ${{ inputs.suites }}
          IDS: ${{ inputs.ids }}
          HAS_KEY: ${{ secrets.GROQ_API_KEY != '' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_LIMITS: ${{ vars.LLM_LIMITS }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          re_model='^[A-Za-z0-9._/:-]{1,100}$'
          re_tag='^[A-Za-z0-9][A-Za-z0-9._-]{0,40}$'
          re_suites='^[a-z_ ]*$'
          re_ids='^[A-Za-z0-9_ -]*$'
          [[ $MODEL =~ $re_model ]] || fail "model: unexpected characters"
          [[ $TAG =~ $re_tag ]] || fail "tag: letters, digits, . _ - only"
          [[ $SUITES =~ $re_suites ]] || fail "suites: lower-case names separated by spaces"
          [[ $IDS =~ $re_ids ]] || fail "ids: letters, digits, _ - separated by spaces"
          [ "$HAS_KEY" = "true" ] || fail "repository secret GROQ_API_KEY is not set"
          [ -n "$GROQ_MODEL" ] || fail "repository variable GROQ_MODEL is not set"
          [ -n "$LLM_LIMITS" ] || fail "repository variable LLM_LIMITS is not set"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Live tests
        if: inputs.live_tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_LIMITS: ${{ vars.LLM_LIMITS }}
        run: pytest -m live -q -p no:cacheprovider

      - name: Run evals
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_LIMITS: ${{ vars.LLM_LIMITS }}
          ROLE: ${{ inputs.role }}
          MODEL: ${{ inputs.model }}
          TAG: ${{ inputs.tag }}
          SUITES: ${{ inputs.suites }}
          IDS: ${{ inputs.ids }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          args=(--role "$ROLE" --model "$MODEL" --repeats "$REPEATS" --tag "ci-$TAG" --yes)
          # Word splitting of SUITES and IDS is intended; both were checked above.
          [ -z "$SUITES" ] || args+=(--suites $SUITES)
          [ -z "$IDS" ] || args+=(--ids $IDS)
          python -m evals.runner "${args[@]}"

      - name: Report to job summary
        if: always()
        run: |
          report=$(ls -d evals/reports/*-ci-*/ 2>/dev/null | tail -n 1)
          if [ -n "$report" ] && [ -f "${report}report.md" ]; then
            cat "${report}report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was written (the run stopped before its first result)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Baseline gate
        run: |
          {
            echo "### Baseline gate"
            echo "No accepted baseline yet: it is set from the full run in step 6.5. This run was not compared."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report-${{ github.run_id }}
          path: |
            evals/reports/*-ci-*/
            !evals/reports/*/cache/
          if-no-files-found: ignore
          retention-days: 30
